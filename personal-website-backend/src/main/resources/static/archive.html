<script>
    const per = 10;
    const posts = [
        { title: '深入学习 Java 后端的一周总结', date: '2024-11-15', category: '技术', link: 'article.html' },
        { title: '周末的咖啡时光', date: '2024-11-14', category: '杂谈', link: 'article.html' },
        { title: 'Bug 终于解决了', date: '2024-11-14', category: '瞬间', link: 'article.html' },
        { title: '读《黑客与画家》有感', date: '2024-11-13', category: '杂谈', link: 'article.html' },
        { title: 'MySQL 索引优化实践', date: '2024-11-12', category: '技术', link: 'article.html' },
        { title: '容器化之路：Docker 初体验', date: '2024-11-10', category: '技术', link: 'article.html' },
        { title: '秋天的第一杯咖啡', date: '2024-11-05', category: '瞬间', link: 'article.html' },
        { title: 'Kafka 消息队列实战总结', date: '2024-10-28', category: '技术', link: 'article.html' },
        { title: '十月的读书清单', date: '2024-10-20', category: '杂谈', link: 'article.html' },
        { title: 'Spring Boot 自动配置原理解析', date: '2024-10-15', category: '技术', link: 'article.html' },
        { title: '分布式事务解决方案对比', date: '2024-09-25', category: '技术', link: 'article.html' },
        { title: '2023 年度总结', date: '2023-12-28', category: '杂谈', link: 'article.html' },
        { title: '年度阅读清单', date: '2023-12-15', category: '杂谈', link: 'article.html' }
    ].sort((a, b) => new Date(b.date) - new Date(a.date));

    let page = 1;
    const listEl = document.getElementById('archive-list');
    const pager = document.getElementById('pager');

    function render() {
        listEl.innerHTML = '';
        const total = Math.max(1, Math.ceil(posts.length / per));
        const start = (page - 1) * per;
        let prevYear = null;
        let prevMonth = null;
        posts.slice(start, start + per).forEach(p => {
            const d = new Date(p.date);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const showYear = year !== prevYear;
            const showMonth = showYear || month !== prevMonth;
            prevYear = year;
            prevMonth = month;
            const item = document.createElement('div');
            item.className = 'archive-item';
            item.innerHTML = `
                ${showYear ? `<div class="year">${year}年</div>` : ''}
                ${showMonth ? `<div class="month">${month}月</div>` : ''}
                <div class="day-title">${day}日 · ${p.category} · ${p.title}<span style="float:right;"><a class="read-more" href="${p.link}">查看 →</a></span></div>
            `;
            listEl.appendChild(item);
        });
        renderPager(total);
    }

    function goto(p) {
        const total = Math.max(1, Math.ceil(posts.length / per));
        page = Math.min(Math.max(1, p), total);
        render();
    }

    function renderPager(total) {
        pager.innerHTML = '';
        const links = [];
        const push = (label, p, active=false) => {
            const el = document.createElement('span');
            el.className = 'pager-link' + (active ? ' active' : '');
            el.textContent = label;
            if (!active && p) el.onclick = () => goto(p);
            links.push(el);
        };
        if (page > 1) push('上一页', page-1);
        push('1', 1, page===1);
        if (total >= 2) push('2', 2, page===2);
        if (page > 3) push('...', null);
        if (page > 2 && page < total-1) push(String(page), page, true);
        if (total > 2) push(String(total), total, page===total);
        if (page < total) push('下一页', page+1);
        links.forEach(el => pager.appendChild(el));
    }

    render();
</script>

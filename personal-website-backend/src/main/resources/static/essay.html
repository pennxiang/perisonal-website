<script>
    const per = 16;
    const posts = Array.from({length: 28}, (_, i) => ({
        title: `杂谈第 ${i + 1} 篇`,
        by: `2024-11-${(i % 28 + 1).toString().padStart(2, '0')}`,
        link: 'article.html',
        summary: '这一段用于展示列表卡片的简介段落，用来记录日常思考。'
    }));

    let page = 1;
    const grid = document.getElementById('grid');
    const pager = document.getElementById('pager');

    function render() {
        grid.innerHTML = '';
        const total = Math.max(1, Math.ceil(posts.length / per));
        const start = (page - 1) * per;
        posts.slice(start, start + per).forEach(post => {
            const el = document.createElement('article');
            el.className = 'article';
            el.innerHTML = `
                <h2><a href="${post.link}" style="text-decoration:none;color:inherit">${post.title}</a></h2>
                <div class="byline">${post.by}</div>
                <p>${post.summary}</p>
                <div class="card-footer"><a class="read-more" href="${post.link}">查看全文 →</a></div>
            `;
            grid.appendChild(el);
        });
        renderPager(total);
    }

    function goto(p) {
        const total = Math.max(1, Math.ceil(posts.length / per));
        const target = Math.min(Math.max(1, p), total);
        page = target;
        render();
    }

    function renderPager(total) {
        pager.innerHTML = '';
        const links = [];
        const push = (label, p, active=false) => {
            const el = document.createElement('span');
            el.className = 'pager-link' + (active ? ' active' : '');
            el.textContent = label;
            if (!active && p) el.onclick = () => goto(p);
            links.push(el);
        };
        if (page > 1) push('上一页', page-1);
        push('1', 1, page===1);
        if (total >= 2) push('2', 2, page===2);
        if (page > 3) push('...', null);
        if (page > 2 && page < total-1) push(String(page), page, true);
        if (total > 2) push(String(total), total, page===total);
        if (page < total) push('下一页', page+1);
        links.forEach(el => pager.appendChild(el));
    }

    render();
</script>

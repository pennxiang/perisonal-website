<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: common-head}"></head>
<body>
<div class="newspaper">
    <nav th:replace="~{fragments/navigation :: navigation('category')}"></nav>
    <header class="masthead">
        <h1>分类</h1>
        <div class="tagline">按分类浏览文章</div>
    </header>

    <section style="max-width:900px;margin:0 auto;">
        <div th:each="category : ${categories}" style="margin-bottom:24px;">
            <h2 th:text="${category.name}">分类名称</h2>
            <p th:text="${category.count + ' 篇文章'}">10 篇文章</p>
            <div style="margin-top:12px;">
                <article class="article" th:each="article : ${category.articles}">
                    <h3><a th:href="@{/article/{id}(id=${article.id})}" th:text="${article.title}">文章标题</a></h3>
                    <div class="byline" th:text="${article.publishDate}">2024-11-15</div>
                </article>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/footer :: common-footer}"></footer>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: common-head}"></head>
<body>
<div class="newspaper">
    <nav th:replace="~{fragments/navigation :: navigation('tech')}"></nav>
    <header class="masthead">
        <h1>技术</h1>
        <div class="tagline">后端技术学习与实践</div>
    </header>

    <main class="article-row">
        <article class="article" th:each="tech : ${techArticles}">
            <h2><a th:href="@{/article/{id}(id=${tech.id})}" style="text-decoration:none;color:inherit" th:text="${tech.title}">技术文章标题</a></h2>
            <div class="byline" th:text="${tech.publishDate}">2024-11-15</div>
            <p th:text="${tech.summary}">文章简介内容</p>
            <div class="card-footer"><a class="read-more" th:href="@{/article/{id}(id=${tech.id})}">查看全文 →</a></div>
        </article>
    </main>

    <div class="pager-bar" th:if="${totalPages > 1}">
        <span class="pager-link" th:if="${currentPage > 1}">
            <a th:href="@{/tech(page=${currentPage - 1})}">上一页</a>
        </span>
        <span class="pager-link" th:each="i : ${#numbers.sequence(1, totalPages)}"
              th:classappend="${i == currentPage} ? 'active' : ''">
            <a th:href="@{/tech(page=${i})}" th:text="${i}">1</a>
        </span>
        <span class="pager-link" th:if="${currentPage < totalPages}">
            <a th:href="@{/tech(page=${currentPage + 1})}">下一页</a>
        </span>
    </div>

    <footer th:replace="~{fragments/footer :: common-footer}"></footer>
</div>
</body>
</html>

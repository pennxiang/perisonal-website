server:
  port: 8080

spring:
  application:
    name: personal-website

  # pn“Mn - TODO: k™žE„pn“Þ¥áo
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/personal_blog?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: # TODO: k™pn“Æ
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin

  # RedisMn - TODO: k™žE„RedisÞ¥áo
  data:
    redis:
      host: localhost
      port: 6379
      password: # TODO: k™RedisÆ
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 1000

# MyBatisMn
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.shuiqingzheng.module.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWTMn - TODO: k™žE„JWTÆ¥
jwt:
  secret: # TODO: k™JWTÆ¥
  expiration: 3600 # Çöô(Ò)

# å×Mn
logging:
  level:
    com.shuiqingzheng: debug
    org.springframework.web: info
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'

<script>
    const posts = [
        { title: '深入学习 Java 后端的一周总结', by: '2024-11-15', summary: 'Redis、MySQL 调优与 Checklist 落地。', link: 'article.html' },
        { title: 'MySQL 索引优化实践', by: '2024-11-12', summary: ' explain 读法、覆盖索引与组合索引细节。', link: 'article.html' },
        { title: '周末的咖啡时光', by: '2024-11-14', summary: '在风味与温度里想清楚研发节奏。', link: 'article.html' },
        { title: '瞬间：秋天的第一杯咖啡', by: '2024-11-05', summary: '梧桐叶黄，代码也该热起来。', link: 'article.html' },
        { title: 'Spring Boot 自动配置原理解构', by: '2024-10-15', summary: '从启动注解到条件装配，拆解自动配置流程。', link: 'article.html' }
    ];

    const input = document.getElementById('search-input');
    const btn = document.getElementById('search-btn');
    const list = document.getElementById('search-results');

    function render(query = '') {
        list.innerHTML = '';
        const q = query.trim().toLowerCase();
        const filtered = q ? posts.filter(p => p.title.toLowerCase().includes(q) || p.summary.toLowerCase().includes(q)) : posts;
        if (filtered.length === 0) {
            const empty = document.createElement('article');
            empty.className = 'article';
            empty.innerHTML = '<p>没有找到匹配的内容，换个关键词试试。</p>';
            list.appendChild(empty);
            return;
        }
        filtered.forEach(p => {
            const el = document.createElement('article');
            el.className = 'article';
            el.innerHTML = `
                <h2><a href=\"${p.link}\" style=\"text-decoration:none;color:inherit\">${p.title}</a></h2>
                <div class=\"byline\">${p.by}</div>
                <p>${p.summary}</p>
                <div class=\"card-footer\"><a class=\"read-more\" href=\"${p.link}\">查看全文 →</a></div>
            `;
            list.appendChild(el);
        });
    }

    function onSearch() {
        render(input.value);
    }

    input.addEventListener('input', onSearch);
    btn.addEventListener('click', onSearch);
    render();
</script>

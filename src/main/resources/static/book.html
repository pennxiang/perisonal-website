<script>
    const items = [
        { title: 'Effective Java（第 3 版）', meta: '技术 · 9.4 分', reason: 'Java 最佳实践合集。' },
        { title: '深入理解 JVM（第 3 版）', meta: '技术 · 9.2 分', reason: 'GC 与内存模型的入门必读。' },
        { title: '三体三部曲', meta: '人文 / 科幻 · 9.5 分', reason: '宏大宇宙观与人性拷问。' },
        { title: '黑客与画家', meta: '人文 · 创业 · 8.8 分', reason: '技术与思考方式的碰撞。' }
    ];

    const grid = document.getElementById('grid');
    items.forEach(item => {
        const el = document.createElement('article');
        el.className = 'article';
        el.innerHTML = `
            <div class="recommend-row">
                <div class="recommend-poster">图</div>
                <div class="recommend-info">
                    <h2><a href="article.html" style="text-decoration:none;color:inherit">${item.title}</a></h2>
                    <div class="byline">${item.meta}</div>
                    <p>${item.reason}</p>
                </div>
            </div>
        `;
        grid.appendChild(el);
    });
</script>
